<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Make a small tool worth keeping</title>
  <desc id="desc">A checklist for turning a one-off script into a dependable tool: the real job, a preview, useful help, safe defaults, one copyable example and plain reporting of partial failure.</desc>
  <rect width="1200" height="630" fill="#0D0F12"/>
  <circle cx="1162" cy="324" r="232" fill="none" stroke="#15181D" stroke-width="24"/>
  <circle cx="1162" cy="324" r="208" fill="none" stroke="#1D2127" stroke-width="24"/>

  <!-- Brand label -->
  <text x="80" y="90" font-family="Courier New, monospace" font-size="24" font-weight="700" letter-spacing="2"><tspan fill="#FF6B35">[+]</tspan><tspan fill="#F3F1EC" dx="9">USEFUL</tspan><tspan fill="#FF6B35">/</tspan><tspan fill="#F3F1EC">STASH</tspan></text>
  <text x="80" y="128" font-family="Courier New, monospace" font-size="18" font-weight="700" letter-spacing="2" fill="#969CA6">[ TOOLS ] [ WORKFLOW ]</text>
  <path d="M80 166h92" stroke="#FF6B35" stroke-width="6"/>

  <!-- Headline -->
  <text x="74" y="270" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="-4" fill="#F3F1EC">Make a small</text>
  <text x="74" y="350" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="-4" fill="#F3F1EC">tool worth</text>
  <text x="74" y="430" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="-4" fill="#FF6B35">keeping.</text>
  <text x="80" y="506" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#969CA6">It's finished when the next</text>
  <text x="80" y="540" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#969CA6">person can run it safely.</text>
  <text x="80" y="590" font-family="Courier New, monospace" font-size="15" letter-spacing="1" fill="#5E646E">PRACTICAL CHECKLIST</text>

  <!-- Checklist from the article -->
  <g transform="translate(672 100)">
    <rect width="430" height="404" rx="14" fill="#1D2127" stroke="#2A2F37" stroke-width="2"/>
    <text x="24" y="38" font-family="Courier New, monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#969CA6">WORTH KEEPING?</text>
    <path d="M24 52h382" stroke="#2A2F37" stroke-width="2"/>
    <g transform="translate(0 30)"><rect x="24" y="60" width="24" height="24" rx="5" fill="#FF6B35"/><path d="M30 72l5 5 9-10" fill="none" stroke="#0D0F12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="77" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#F3F1EC">Write down the real job</text><text x="64" y="97" font-family="Courier New, monospace" font-size="13" fill="#969CA6">input · result · worst failure</text><rect x="24" y="110" width="24" height="24" rx="5" fill="#FF6B35"/><path d="M30 122l5 5 9-10" fill="none" stroke="#0D0F12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="127" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#F3F1EC">Preview before changing</text><text x="64" y="147" font-family="Courier New, monospace" font-size="13" fill="#969CA6">--preview shows the plan first</text><rect x="24" y="160" width="24" height="24" rx="5" fill="#FF6B35"/><path d="M30 172l5 5 9-10" fill="none" stroke="#0D0F12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="177" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#F3F1EC">A useful --help</text><text x="64" y="197" font-family="Courier New, monospace" font-size="13" fill="#969CA6">honest about what it does</text><rect x="24" y="210" width="24" height="24" rx="5" fill="#FF6B35"/><path d="M30 222l5 5 9-10" fill="none" stroke="#0D0F12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="227" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#F3F1EC">Safe defaults</text><text x="64" y="247" font-family="Courier New, monospace" font-size="13" fill="#969CA6">nothing destructive by accident</text><rect x="24" y="260" width="24" height="24" rx="5" fill="#FF6B35"/><path d="M30 272l5 5 9-10" fill="none" stroke="#0D0F12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="277" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#F3F1EC">One copyable example</text><text x="64" y="297" font-family="Courier New, monospace" font-size="13" fill="#969CA6">no five placeholders to edit</text><rect x="24" y="310" width="24" height="24" rx="5" fill="#FF6B35"/><path d="M30 322l5 5 9-10" fill="none" stroke="#0D0F12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="327" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#F3F1EC">Say partial failure plainly</text><text x="64" y="347" font-family="Courier New, monospace" font-size="13" fill="#969CA6">what was left behind, and why</text></g>
  </g>
  <!-- Official logo (Simple Icons, CC0), for editorial identification -->
