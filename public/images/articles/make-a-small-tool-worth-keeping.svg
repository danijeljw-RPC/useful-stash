.046,1.013,1.164,1.732C21.686,6.557,21.12,6.411,20.459,6.797z" fill="#4EAA25"/><text x="58" y="32" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" fill="#1D2127">GNU Bash</text></g>
</svg>
