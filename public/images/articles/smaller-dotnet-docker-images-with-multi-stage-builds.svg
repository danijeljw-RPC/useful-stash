<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">A container cleanup you can explain: smaller .NET Docker images</title>
  <desc id="desc">A .NET 10 Docker image cut from 1.35 GB to 370 MB with one build stage and one explicit copy.</desc>
  <rect width="1200" height="630" fill="#0D0F12"/>
  <circle cx="1162" cy="324" r="232" fill="none" stroke="#15181D" stroke-width="24"/>
  <circle cx="1162" cy="324" r="208" fill="none" stroke="#1D2127" stroke-width="24"/>

  <!-- Brand label -->
  <text x="80" y="90" font-family="Courier New, monospace" font-size="24" font-weight="700" letter-spacing="2"><tspan fill="#FF6B35">[+]</tspan><tspan fill="#F3F1EC" dx="9">USEFUL</tspan><tspan fill="#FF6B35">/</tspan><tspan fill="#F3F1EC">STASH</tspan></text>
  <text x="80" y="128" font-family="Courier New, monospace" font-size="18" font-weight="700" letter-spacing="2" fill="#969CA6">[ DOCKER ] [ .NET ]</text>
  <path d="M80 166h92" stroke="#FF6B35" stroke-width="6"/>

  <!-- Headline -->
  <text x="74" y="270" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="-4" fill="#F3F1EC">A container</text>
  <text x="74" y="350" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="-4" fill="#F3F1EC">cleanup you</text>
  <text x="74" y="430" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="-4" fill="#FF6B35">can explain.</text>
  <text x="80" y="506" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#969CA6">1.35 GB to 370 MB: one build</text>
  <text x="80" y="540" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#969CA6">stage, one explicit copy.</text>
  <text x="80" y="590" font-family="Courier New, monospace" font-size="15" letter-spacing="1" fill="#5E646E">INDEPENDENT GUIDE · NOT AFFILIATED</text>

  <!-- Image size comparison (measured in the article) -->
  <g transform="translate(720 0)">
    <path d="M0 470h400" stroke="#2A2F37" stroke-width="2"/>
    <rect x="40" y="170" width="120" height="300" rx="6" fill="#1D2127" stroke="#2A2F37" stroke-width="2"/>
    <g fill="#2A2F37"><rect x="56" y="188" width="88" height="16" rx="3"/><rect x="56" y="214" width="88" height="16" rx="3"/><rect x="56" y="240" width="88" height="16" rx="3"/><rect x="56" y="266" width="88" height="16" rx="3"/><rect x="56" y="292" width="88" height="16" rx="3"/><rect x="56" y="318" width="88" height="16" rx="3"/><rect x="56" y="344" width="88" height="16" rx="3"/><rect x="56" y="370" width="88" height="16" rx="3"/><rect x="56" y="396" width="88" height="16" rx="3"/><rect x="56" y="422" width="88" height="16" rx="3"/><rect x="56" y="448" width="88" height="16" rx="3"/></g>
    <text x="100" y="154" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#969CA6">1.35 GB</text>
    <text x="100" y="500" text-anchor="middle" font-family="Courier New, monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#5E646E">BEFORE</text>

    <rect x="240" y="388" width="120" height="82" rx="6" fill="#FF6B35"/>
    <g fill="#0D0F12" fill-opacity="0.25"><rect x="256" y="402" width="88" height="16" rx="3"/><rect x="256" y="428" width="88" height="16" rx="3"/><rect x="256" y="454" width="88" height="16" rx="3"/></g>
    <text x="300" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#F3F1EC">370 MB</text>
    <text x="300" y="500" text-anchor="middle" font-family="Courier New, monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#FF6B35">AFTER</text>

    <path d="M176 230c30-20 46-10 52 30" fill="none" stroke="#FF6B35" stroke-width="3" stroke-dasharray="6 6"/>
    <path d="M220 252l8 12 8-14" fill="none" stroke="#FF6B35" stroke-width="3" stroke-linejoin="round"/>
    <rect x="232" y="150" width="136" height="40" rx="8" fill="#1D2127" stroke="#2A2F37" stroke-width="2"/>
    <text x="300" y="177" text-anchor="middle" font-family="Courier New, monospace" font-size="20" font-weight="700" fill="#FF6B35">−72.6%</text>
  </g>
